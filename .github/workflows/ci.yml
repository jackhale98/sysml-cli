name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Grammar + sysml-v2-release submodules: the embedded standard
          # library and parser are built from these.
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Before the cache and the build: formatting needs neither, so a
      # formatting-only failure reports in seconds.
      - name: Format
        run: cargo fmt --check

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check fixtures
        run: cargo run -p sysml-cli -- check --severity error --disable duplicates,syntax test/fixtures/*.sysml

      - name: Simulation smoke test
        run: cargo run -p sysml-cli -- simulate list test/fixtures/simulation.sysml

      - name: Export smoke test
        run: cargo run -p sysml-cli -- export list test/fixtures/fmi-vehicle.sysml

  wasm:
    name: WebAssembly engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - name: Build
        run: scripts/build-wasm.sh target/sysml-wasm | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sysml-wasm
          path: target/sysml-wasm
