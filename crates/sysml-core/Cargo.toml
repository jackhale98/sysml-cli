[package]
name = "sysml-core"
version = "0.9.3"
edition = "2021"
description = "SysML v2 parser, validator, simulator, and model query engine"
license.workspace = true
repository = "https://github.com/jackhale98/sysml-cli"

[features]
default = []

[dependencies]
tree-sitter = "0.27"
# Direct dependency so its wasm libc headers reach build.rs (DEP_* metadata).
tree-sitter-language = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
