[package]
name = "sysml-core"
version = "0.9.3"
edition = "2021"
description = "SysML v2 parser, validator, simulator, and model query engine"
license.workspace = true
repository = "https://github.com/jackhale98/sysml-cli"

[features]
default = []

[dependencies]
sysml-syntax = { path = "../sysml-syntax" }
sysml-semantic = { path = "../sysml-semantic" }
tree-sitter = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
