[package]
name = "sysml-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the SysML v2 engine"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sysml-core = { path = "../sysml-core" }
sysml-interchange = { path = "../sysml-interchange" }
sysml-semantic = { path = "../sysml-semantic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
